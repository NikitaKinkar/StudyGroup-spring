services:
  - type: web
    name: study-group-finder-backend
    runtime: docker
    dockerfilePath: ./study-group-finder-backend/Dockerfile
    dockerContext: ./study-group-finder-backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"
      - key: APP_FRONTEND_URL
        value: "https://*.vercel.app"
