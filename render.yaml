services:
  - type: web
    name: study-group-finder-backend
    runtime: docker
    dockerfilePath: ./study-group-finder-backend/Dockerfile
    dockerContext: ./study-group-finder-backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        value: "jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/studygroup_db?createDatabaseIfNotExist=true&sslMode=VERIFY_IDENTITY"
      - key: SPRING_DATASOURCE_USERNAME
        value: "3T14AaKv26o9rhu.root"
      - key: SPRING_DATASOURCE_PASSWORD
        value: "eLUxjZEcwgopzdE1"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"
      - key: APP_FRONTEND_URL
        value: "https://*.vercel.app"
